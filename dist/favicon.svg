<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
  </defs>
  
  <!-- Фон - тёмный -->
  <rect width="100" height="100" fill="#1a1a2e"/>
  
  <!-- Шестерёнка (символ настроек) -->
  <circle cx="50" cy="50" r="40" fill="url(#gold)"/>
  <circle cx="50" cy="50" r="25" fill="#1a1a2e"/>
  
  <!-- Зубцы шестерёнки -->
  <g fill="#d4af37">
    <rect x="45" y="10" width="10" height="10"/>
    <rect x="45" y="80" width="10" height="10"/>
    <rect x="10" y="45" width="10" height="10"/>
    <rect x="80" y="45" width="10" height="10"/>
    <rect x="20" y="20" width="8" height="8" transform="rotate(45 24 24)"/>
    <rect x="72" y="20" width="8" height="8" transform="rotate(45 76 24)"/>
    <rect x="20" y="72" width="8" height="8" transform="rotate(45 24 76)"/>
    <rect x="72" y="72" width="8" height="8" transform="rotate(45 76 76)"/>
  </g>
</svg>
